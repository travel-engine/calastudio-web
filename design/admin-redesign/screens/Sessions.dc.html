<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CalaStudio · Sessions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F4F1;font-family:'Figtree',system-ui,sans-serif;color:#17201C}
a{color:#14513F}a:hover{color:#0C3A2D}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 236px;max-width:100%;background:#FFFFFF;border-right:1px solid #E1E3DE;padding:20px 14px;display:flex;flex-direction:column;gap:2px;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:10px;padding:4px 12px 8px;font-weight:700;font-size:18px;letter-spacing:-0.01em}
.grp{padding:18px 12px 6px;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#6A726E}
.navlink{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:#3C4541;text-decoration:none;font-weight:500;font-size:15px}
.navlink:hover{background:#F3F4F1;color:#17201C}
.navlink.on{background:#E2EEE9;color:#0C3A2D;font-weight:600}
.navlink svg{width:20px;height:20px;flex:none}
.signout{margin-top:auto;padding-top:24px}
.main{flex:999 1 560px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid #E1E3DE}
.search{display:flex;align-items:center;gap:10px;flex:0 1 420px;min-height:44px;padding:0 14px;background:#FFFFFF;border:1px solid #DADDD7;border-radius:10px;box-sizing:border-box}
.search input{border:0;outline:0;font:400 15px 'Figtree',sans-serif;width:100%;background:transparent;color:#17201C}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid #DADDD7;background:#FFFFFF;color:#3C4541;cursor:pointer}
.avatar{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding:28px 32px 56px;display:flex;flex-direction:column;gap:20px}
.card{background:#FFFFFF;border:1px solid #E1E3DE;border-radius:14px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font:600 15px 'Figtree',sans-serif;border:1px solid #CDD1CB;background:#FFFFFF;color:#17201C;cursor:pointer;text-decoration:none;white-space:nowrap;box-sizing:border-box}
.btn.pri{background:#14513F;border-color:#14513F;color:#FFFFFF}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.label{font-size:13px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#5A635F}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;background:#EDEEEA;color:#3C4541}
.h1{margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:44px;line-height:1.05}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:#E7EAE5;gap:4px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 14px;border-radius:8px;border:0;background:transparent;font:600 14px 'Figtree',sans-serif;color:#3C4541;cursor:pointer}
.seg button[aria-pressed="true"]{background:#FFFFFF;color:#17201C;box-shadow:0 1px 2px rgba(23,32,28,0.12)}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 20px;border-top:1px solid #EDEEEA;text-decoration:none;color:#17201C}
.srow:hover{background:#F7F8F5}
.thumb{width:52px;height:52px;border-radius:10px;flex:none;display:inline-flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="shell">
  <nav class="side" aria-label="Main">
    <div class="brand"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#14513F"></rect><path d="M6 17c2.5-3 5-3 8 0s5.5 3 8 0" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path><circle cx="14" cy="10" r="2.4" fill="#FFFFFF"></circle></svg>CalaStudio</div>
    <div class="grp">Studio</div>
    <a class="navlink" href="Main.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Dashboard</a>
    <a class="navlink" href="Schedule.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path></svg>Schedule</a>
    <a class="navlink on" href="Sessions.dc.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 3 7.5l9 4.5 9-4.5z"></path><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"></path></svg>Sessions</a>
    <a class="navlink" href="Member.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"></path></svg>Members</a>
    <div class="grp">Revenue</div>
    <a class="navlink" href="Passes.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h15A1.5 1.5 0 0 1 21 7.5V10a2 2 0 0 0 0 4v2.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 16.5V14a2 2 0 0 0 0-4z"></path><path d="M14 6v12" stroke-dasharray="2 2.5"></path></svg>Passes</a>
    <a class="navlink" href="Reports.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M11 20V5M17 20v-6M2 20h20"></path></svg>Reports</a>
    <div class="grp">Settings</div>
    <a class="navlink" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="8" r="3.5"></circle><path d="M3.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5M19 8v6M16 11h6"></path></svg>Team</a>
    <a class="navlink" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Activity log</a>
    <a class="navlink" href="Settings.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>Settings</a>
    <div class="signout"><button class="btn" type="button" style="width: 100%; justify-content: center">Sign out</button></div>
  </nav>

  <main class="main">
    <header class="top">
      <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A635F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span class="sr">Search</span><input type="search" placeholder="Search members, sessions, passes"></label>
      <div style="display: flex; align-items: center; gap: 10px">
        <button class="iconbtn" type="button" aria-label="Help"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"></path></svg></button>
        <button class="iconbtn" type="button" aria-label="Account" style="border-radius: 50%; padding: 0"><span class="avatar" style="background: #14513F; color: #FFFFFF">RM</span></button>
      </div>
    </header>

    <div class="wrap">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span class="label">8 recurring classes</span>
          <h1 class="h1">Sessions</h1>
        </div>
        <a class="btn pri" href="SessionDetail.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New session</a>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
        <label class="search" style="flex: 0 1 340px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A635F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span class="sr">Filter sessions</span><input type="search" placeholder="Filter sessions"></label>
        <div class="seg" role="group" aria-label="Venue"><button type="button" aria-pressed="true">All venues</button><button type="button" aria-pressed="false">Base Training Centre</button><button type="button" aria-pressed="false">Yoga 4 life</button></div>
      </div>

      <sc-for list="{{venues}}" as="v" hint-placeholder-count="2">
        <section class="card" style="overflow: hidden">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 18px 20px 14px">
            <h2 style="margin: 0; font-size: 18px; font-weight: 600">{{v.name}}</h2>
            <span style="font-size: 14px; color: #5A635F">{{v.count}}</span>
          </div>
          <sc-for list="{{v.rows}}" as="s" hint-placeholder-count="4">
            <a class="srow" href="SessionDetail.dc.html">
              <span class="thumb" style="{{s.thumbStyle}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><path d="M5 10c2.5 1 4.5 1.5 7 1.5s4.5-.5 7-1.5M12 11.5V16l-3 4.5M12 16l3 4.5"></path></svg></span>
              <span style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <span style="font-size: 16px; font-weight: 600">{{s.name}}</span>
                <span class="num" style="font-size: 14px; color: #5A635F">{{s.when}} · 60 min · weekly</span>
              </span>
              <span style="width: 140px; flex: none"><span class="chip" style="{{s.teacherStyle}}">{{s.teacher}}</span></span>
              <span class="num" style="width: 90px; flex: none; font-size: 15px; font-weight: 600">{{s.price}}</span>
              <span style="width: 170px; flex: none; display: flex; flex-direction: column; gap: 5px">
                <span class="num" style="font-size: 13px; color: #5A635F">Next · {{s.next}}</span>
                <span style="display: flex; align-items: center; gap: 8px"><span style="width: 90px; height: 6px; border-radius: 3px; background: #E7EAE5; overflow: hidden"><span style="{{s.bar}}"></span></span><span class="num" style="font-size: 14px; font-weight: 600">{{s.booked}} / {{s.cap}}</span></span>
              </span>
              <span style="display: inline-flex; align-items: center; gap: 4px; color: #5A635F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></span>
            </a>
          </sc-for>
        </section>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const s = (name, when, teacher, price, next, booked, cap, tint) => {
      const r = booked / cap, full = r >= 1, low = !full && r >= 0.8;
      return { name, when, teacher, price, next, booked, cap,
        teacherStyle: teacher === 'No teacher' ? 'background:#FBEFD9;color:#7A4508' : 'background:#EDEEEA;color:#3C4541',
        thumbStyle: tint,
        bar: 'display:block;height:100%;border-radius:3px;width:' + Math.round(r * 100) + '%;background:' + (full ? '#B3261E' : low ? '#C77A12' : '#14513F') };
    };
    const a = 'background:#E2EEE9;color:#14513F', b = 'background:#E4ECF8;color:#1D477F';
    return {
      venues: [
        { name: 'Base Training Centre', count: '5 sessions · North Lakes', rows: [
          s('Saturday Morning Yoga · North Lakes', 'Sat · 7:00 am', 'Ravi Platray', 'A$6.00', 'Sat 17 Oct', 12, 20, a),
          s('Sunday Yoga · North Lakes Council Session', 'Sun · 8:00 am', 'Ravi Platray', 'A$6.00', 'Sun 18 Oct', 30, 30, a),
          s('Sunday Second Session Yoga · North Lakes', 'Sun · 9:30 am', 'Ravi Platray', 'A$6.00', 'Sun 18 Oct', 8, 20, a),
          s('Tuesday Morning Vinyasa · North Lakes', 'Tue · 9:00 am', 'Ravi Platray', 'A$6.00', 'Tue 20 Oct', 6, 20, a),
          s('Thursday Morning Vinyasa · North Lakes', 'Thu · 9:00 am', 'Ravi Platray', 'A$6.00', 'Thu 22 Oct', 3, 20, a)
        ] },
        { name: 'Yoga 4 life', count: '3 sessions · Brighton', rows: [
          s('Monday morning Ashtanga · Brighton', 'Mon · 6:00 am', 'No teacher', 'A$10.00', 'Mon 19 Oct', 5, 12, b),
          s('Wednesday Morning Backbends · Brighton', 'Wed · 6:00 am', 'No teacher', 'A$10.00', 'Wed 21 Oct', 2, 12, b),
          s('Saturday Inversions and handstands', 'Sat · 9:00 am', 'Ravi Platray', 'A$10.00', 'Sat 17 Oct', 10, 12, b)
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
